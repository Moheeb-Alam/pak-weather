<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mausam — Pakistan Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { display: ["Fraunces", "serif"], sans: ["Manrope", "sans-serif"] } } } };
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="font-sans text-white min-h-screen antialiased" data-sky="clear-day">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-10">

    <!-- Header + search -->
    <header class="flex flex-col sm:flex-row sm:items-center gap-4 justify-between">
      <h1 class="font-display text-2xl font-medium tracking-tight">Mausam</h1>
      <div class="relative w-full sm:w-96">
        <input id="search" type="search" autocomplete="off" placeholder="Add a city, e.g. Bhakkar, Lahore"
          class="glass w-full rounded-full px-5 py-3 text-sm placeholder-white/60 outline-none focus:ring-2 focus:ring-white/70" />
        <ul id="results" class="glass-strong hidden absolute z-20 mt-2 w-full rounded-2xl overflow-hidden text-sm"></ul>
      </div>
    </header>

    <!-- Saved locations -->
    <nav id="chips" class="flex gap-2 overflow-x-auto py-5" aria-label="Saved locations"></nav>

    <p id="status" class="text-white/80 text-sm min-h-[1.25rem]" role="status"></p>

    <main id="app" class="hidden">
      <!-- Current conditions -->
      <section class="grid md:grid-cols-5 gap-6 items-end">
        <div class="md:col-span-3">
          <p id="place" class="text-lg font-semibold"></p>
          <p id="localtime" class="text-white/75 text-sm"></p>
          <div class="flex items-start gap-4 mt-3">
            <span id="temp" class="font-display font-light leading-none text-[7rem] sm:text-[9rem]"></span>
            <span class="font-display text-4xl mt-4 text-white/80">°C</span>
          </div>
          <p id="condition" class="text-2xl font-medium mt-1"></p>
          <p id="feels" class="text-white/75 mt-1"></p>
        </div>
        <div id="stats" class="md:col-span-2 grid grid-cols-2 gap-3"></div>
      </section>

      <!-- Hourly -->
      <section class="glass rounded-3xl p-5 mt-8">
        <h2 class="font-semibold mb-4">Next 24 hours</h2>
        <div id="hourly" class="flex gap-5 overflow-x-auto pb-2"></div>
      </section>

      <!-- Daily -->
      <section class="glass rounded-3xl p-5 mt-6">
        <h2 class="font-semibold mb-2">7-day forecast</h2>
        <ul id="daily" class="divide-y divide-white/15"></ul>
      </section>
    </main>

    <footer class="text-center text-white/60 text-xs mt-10">
      Weather data by <a class="underline" href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · Sample web development project
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
